services:
  php:
    build: .
    container_name: laravel_livraria_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - laravel_livraria

  nginx:
    image: nginx:alpine
    container_name: laravel_livraria_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - laravel_livraria

  composer:
    image: composer:2
    container_name: laravel_livraria_composer
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - laravel_livraria

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: laravel_livraria_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - laravel_livraria
    # restart: unless-stopped

networks:
  laravel_livraria:
    driver: bridge

volumes:
    sqlserver_data:
        driver: local
